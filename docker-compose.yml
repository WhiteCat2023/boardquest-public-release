services:
  mongodb:
    image: mongo:7.0
    container_name: boardquest_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: boardquest
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: boardquest_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mongodb://mongodb:27017/boardquest
      JWT_SECRET: boardquest_super_secret_jwt_key_prod_2026
    depends_on:
      mongodb:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: boardquest_admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api

  review-center:
    build:
      context: .
      dockerfile: apps/review-center/Dockerfile
    container_name: boardquest_review_center
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  mongo_data:
