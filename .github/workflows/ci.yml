name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Build & Validate Monorepo
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: "mongodb://localhost:27017/boardquest?authSource=admin"
      JWT_SECRET: "ci_jwt_secret_test_key_12345"
      PRIVATE_KEY: "ci_jwt_private_key_test_12345"
      PUBLIC_KEY: "ci_jwt_public_key_test_12345"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-key"
      SUPABASE_STORAGE_BUCKET: "boardquest-storage"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Run Type Checking
        run: pnpm typecheck

      - name: Run Backend Tests
        run: pnpm --filter backend test

      - name: Run Production Build
        run: pnpm build
